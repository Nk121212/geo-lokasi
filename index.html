<script>

    if (navigator.connection) {

        alert(navigator.connection.type);

        const connectionType = navigator.connection.type;
        const effectiveConnectionType = navigator.connection.effectiveType;
        const downlinkMax = navigator.connection.downlinkMax;
        const rtt = navigator.connection.rtt;
        const downlink = navigator.connection.downlink;
        const saveData = navigator.connection.saveData;

        console.log("Tipe Koneksi (perkiraan):", connectionType);
        console.log("Tipe Koneksi Efektif (perkiraan):", effectiveConnectionType);
        console.log("Maksimum Kecepatan Unduh (Mbps):", downlinkMax);
        console.log("Round Trip Time (ms):", rtt);
        console.log("Kecepatan Unduh Saat Ini (Mbps):", downlink);
        console.log("Mode Hemat Data Aktif:", saveData);

        // Anda bisa mencoba melakukan deteksi berdasarkan nilai connectionType:
        if (connectionType === 'wifi') {
            console.log("Kemungkinan menggunakan koneksi Wi-Fi.");
        } else if (connectionType === 'cellular') {
            console.log("Kemungkinan menggunakan koneksi seluler.");
        } else if (connectionType === 'ethernet') {
            console.log("Kemungkinan menggunakan koneksi Ethernet (kabel).");
        } else if (connectionType === 'bluetooth') {
            console.log("Kemungkinan menggunakan koneksi Bluetooth.");
        } else if (connectionType === 'none') {
            console.log("Tidak ada koneksi internet.");
        } else if (connectionType === 'other' || connectionType === 'unknown') {
            console.log("Jenis koneksi lain atau tidak diketahui.");
        }

    // effectiveConnectionType memberikan perkiraan kualitas koneksi (misalnya 'slow-2g', '2g', '3g', '4g').

    } else {
        console.log("Network Information API tidak didukung oleh browser ini.");
    }

    function tampilkanPosisi(posisi) {
        const coords = posisi.coords;

        console.log("Latitude: " + coords.latitude);
        console.log("Longitude: " + coords.longitude);
        console.log("Akurasi Horizontal: " + coords.accuracy + " meter");

        dapatkanNamaLokasi(coords.latitude, coords.longitude);

        if (coords.altitude !== null) {
            console.log("Ketinggian: " + coords.altitude + " meter");
        } else {
            console.log("Informasi ketinggian tidak tersedia.");
        }

        if (coords.altitudeAccuracy !== null) {
            console.log("Akurasi Ketinggian: " + coords.altitudeAccuracy + " meter");
        } else {
            console.log("Akurasi ketinggian tidak tersedia.");
        }

        if (coords.heading !== null) {
            console.log("Arah Perjalanan: " + coords.heading + " derajat");
        } else {
            console.log("Informasi arah perjalanan tidak tersedia.");
        }

        if (coords.speed !== null) {
            console.log("Kecepatan: " + coords.speed + " meter per detik");
        } else {
            console.log("Informasi kecepatan tidak tersedia.");
        }

        // Lakukan tindakan lain dengan data lokasi ini
    }

    function dapatkanLokasi() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(tampilkanPosisi, tampilkanError);
        } else {
            alert("Geolocation tidak didukung oleh browser ini.");
        }
    }

    function tampilkanError(error) {
        switch(error.code) {
            case error.PERMISSION_DENIED:
            alert("Pengguna menolak permintaan untuk geolokasi.");
            break;
            case error.POSITION_UNAVAILABLE:
            alert("Informasi lokasi tidak tersedia.");
            break;
            case error.TIMEOUT:
            alert("Permintaan untuk mendapatkan lokasi pengguna telah habis waktu.");
            break;
            case error.UNKNOWN_ERROR:
            alert("Terjadi kesalahan yang tidak diketahui.");
            break;
        }
    }

    function dapatkanNamaLokasi(latitude, longitude) {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
            if (data && data.display_name) {
                console.log("Nama Lokasi:", data.display_name);
                alert(data.display_name);
                return data.display_name;
            } else {
                console.log("Nama lokasi tidak ditemukan.");
                return null;
            }
            })
            .catch(error => {
            console.error("Terjadi kesalahan saat mendapatkan nama lokasi:", error);
            return null;
            });
    }

    dapatkanLokasi();
</script>
