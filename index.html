    function getNamaLokasi(latitude, longitude) {
        const apiKey = 'YOUR_GOOGLE_API_KEY'; // GANTI DENGAN KUNCI API ANDA YANG SEBENARNYA
        const apiUrl = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${latitude},${longitude}&key=${apiKey}`;

        return fetch(apiUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // Proses data respons dari Google Geocoding API
                if (data && data.results && data.results.length > 0 && data.results[0].formatted_address) {
                    return data.results[0].formatted_address;
                } else {
                    return "Nama lokasi tidak ditemukan";
                }
            })
            .catch(error => {
                console.error("Terjadi kesalahan saat mendapatkan nama lokasi:", error);
                return "Gagal mendapatkan nama lokasi";
            });
    }

    const latitude = -6.1944491;
    const longitude = 106.8229198;

    getNamaLokasi(latitude, longitude)
        .then(namaLokasi => {
            console.log(`Nama lokasi untuk ${latitude}, ${longitude}: ${namaLokasi}`);
            // Lakukan sesuatu dengan nama lokasi ini
        });

</script>
